#############
### Tasks ###
#############

[tasks.install]
extends = "js:install"

[tasks.check]
extends = "js:check"

[tasks."check:ci"]
extends = "js:check:ci"
depends = ["gql:check"]

[tasks.codegen]
description = "Generate GraphQL data derived from the backend schema"
depends = ["//elixir/backend:compile"]
run = ["pnpm codegen"]

[tasks."codegen:check"]
description = "Check if the generated GraphQL files are up to date"
run = [
  "pnpm codegen",
  "git diff --exit-code -- src/graphql/graphql-env.d.ts src/graphql/introspection.ts",
]

[tasks."gql:check"]
description = "Run GraphQLSP diagnostics on GraphQL documents"
run = ["pnpm exec gql-tada check --tsconfig ./tsconfig.app.json --fail-on-warn"]

[tasks.build]
depends = ["//js/packages/sdk:build"]
extends = "js:build"

[tasks.dev]
description = "Start the project in development mode"
run = ["pnpm dev"]
