name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Cache backend deps & build
        uses: actions/cache@v4
        with:
          path: |
            elixir/backend/deps
            elixir/backend/_build
          key: ${{ runner.os }}-backend-mix-${{ hashFiles('elixir/backend/mix.lock') }}
          restore-keys: ${{ runner.os }}-backend-mix-

      - name: Cache Hex & Rebar
        id: mix-archives
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise/installs/elixir/*/.mix
          key: ${{ runner.os }}-railswitch-mix-archives-${{ hashFiles('mise.toml') }}

      - name: Install Hex & Rebar
        if: steps.mix-archives.outputs.cache-hit != 'true'
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install deps
        run: mise run //elixir/backend:install

      - name: Compile
        run: mise run //elixir/backend:compile

      - name: Check formatting, linting & generated files
        run: mise run //elixir/backend:check

      - name: Run tests
        run: mise run //elixir/backend:test

  js:
    name: JS
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: js/package.json

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $FORGEJO_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('js/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: mise run //js:install

      - name: Check formatting & linting
        run: mise run //js:check:ci

      - name: Check generated files
        run: mise run //js:codegen:check

      - name: Typecheck
        run: mise run //js:typecheck

      - name: Test
        run: mise run //js:test

      - name: Build
        run: mise run //js:build

  images:
    name: Image (${{ matrix.image }})
    needs: [backend, js]
    if: forgejo.event_name == 'push'
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - image: backend
            context: elixir/backend
            file: elixir/backend/Dockerfile
          - image: frontend
            context: js
            file: js/apps/frontend/Dockerfile

    concurrency:
      group: images-${{ matrix.image }}-${{ forgejo.ref }}
      cancel-in-progress: false

    steps:
      - name: Check registry configuration
        shell: bash
        run: |
          if [ -z "${{ vars.REGISTRY_HOST }}" ]; then
            echo "The REGISTRY_HOST variable is not set"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.REGISTRY_HOST }}/${{ forgejo.repository_owner }}/railswitch-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
