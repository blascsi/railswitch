name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Cache backend deps & build
        uses: actions/cache@v4
        with:
          path: |
            elixir/backend/deps
            elixir/backend/_build
          key: ${{ runner.os }}-backend-mix-${{ hashFiles('elixir/backend/mix.lock') }}
          restore-keys: ${{ runner.os }}-backend-mix-

      - name: Cache Hex & Rebar
        id: mix-archives
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise/installs/elixir/*/.mix
          key: ${{ runner.os }}-railswitch-mix-archives-${{ hashFiles('mise.toml') }}

      - name: Install Hex & Rebar
        if: steps.mix-archives.outputs.cache-hit != 'true'
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install deps
        run: mise run //elixir/backend:install

      - name: Compile
        run: mise run //elixir/backend:compile

      - name: Check formatting, linting & generated files
        run: mise run //elixir/backend:check

      - name: Run tests
        run: mise run //elixir/backend:test

  js:
    name: JS
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: js/package.json

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('js/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: mise run //js:install

      - name: Check formatting & linting
        run: mise run //js:check:ci

      - name: Typecheck
        run: mise run //js:typecheck

      - name: Test
        run: mise run //js:test

      - name: Build
        run: mise run //js:build
