name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  warm-caches:
    name: Warm caches
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install mise + tools
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Cache railswitch backend deps & build
        uses: actions/cache@v4
        with:
          path: |
            elixir/railswitch_backend/deps
            elixir/railswitch_backend/_build
          key: ${{ runner.os }}-railswitch-backend-mix-${{ hashFiles('elixir/railswitch_backend/mix.lock') }}
          restore-keys: ${{ runner.os }}-railswitch-backend-mix-

      - name: Install Hex & Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch & compile railswitch backend deps
        working-directory: elixir/railswitch_backend
        env:
          MIX_ENV: test
        run: |
          mix deps.get
          mix deps.compile

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: js/package.json

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('js/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install frontend deps
        working-directory: js
        run: pnpm install --frozen-lockfile

  railswitch-backend-test-and-lint:
    name: Railswitch backend tests and format check
    runs-on: ubuntu-24.04
    needs: warm-caches

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Restore railswitch backend deps cache
        uses: actions/cache@v4
        with:
          path: |
            elixir/railswitch_backend/deps
            elixir/railswitch_backend/_build
          key: ${{ runner.os }}-railswitch-backend-mix-${{ hashFiles('elixir/railswitch_backend/mix.lock') }}
          restore-keys: ${{ runner.os }}-railswitch-backend-mix-

      - name: Install Hex & Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Check if project compiles
        working-directory: elixir/railswitch_backend
        run: mix compile --warnings-as-errors

      - name: Check formatting
        working-directory: elixir/railswitch_backend
        run: mix format --check-formatted

      - name: Run linter
        working-directory: elixir/railswitch_backend
        run: mix credo --strict

      - name: Check for un-generated migrations
        working-directory: elixir/railswitch_backend
        run: mix ash.codegen --check

      - name: "Check for stale openapi.json"
        working-directory: elixir/railswitch_backend
        run: mix openapi.generate --check

      - name: Run tests
        working-directory: elixir/railswitch_backend
        run: mix test

  frontend-lint-and-build:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    needs: warm-caches

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: js/package.json

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('js/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install frontend deps
        working-directory: js
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: js/apps/frontend
        run: pnpm run ci

      - name: Build
        working-directory: js/apps/frontend
        run: pnpm run build
